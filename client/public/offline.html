<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2d2b" />
    <title>출장동선 · 오프라인</title>
    <style>
      :root { color: #1f2d2b; background: #f7f2e9; font-family: Pretendard, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 560px); border: 1px solid rgba(31,45,43,.22); background: #fffdf7; padding: 34px; box-shadow: 10px 10px 0 rgba(31,45,43,.09); }
      p:first-child { margin: 0; color: #c4503d; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 18px 0 12px; font-size: clamp(34px, 9vw, 54px); line-height: .98; letter-spacing: -.06em; }
      p { line-height: 1.7; color: #5f625b; }
      button { margin-top: 16px; border: 0; background: #1f2d2b; color: #f7f2e9; padding: 12px 16px; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p>Municipal trip desk</p>
      <h1>인터넷 연결을 확인해 주세요.</h1>
      <p>마지막으로 열었던 출장동선 화면은 연결이 복구되면 다시 사용할 수 있습니다. 임시 초안을 편집한 뒤 연결이 돌아오면 계정 동기화를 진행해 주세요.</p>
      <button type="button" onclick="location.reload()">연결 다시 확인</button>
    </main>
  </body>
</html>
